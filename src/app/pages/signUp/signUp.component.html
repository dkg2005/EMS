<div class="auth-container">
  <div class="auth-card">
    <h2>Sign Up</h2>

    <div class="form-group">
      <label>Name</label>
      <input [(ngModel)]="signupData.name" placeholder="Enter name" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="signupData.email" type="email" placeholder="John123@example.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="signupData.password" type="password"  placeholder="Enter password"/>
    </div>

    <div class="form-group">
      <label>Department</label>
      <select [(ngModel)]="signupData.departmentId">
        <option value="">Select department</option>
        <option *ngFor="let d of departments" [ngValue]="d.id">
          {{ d.name }}
        </option>
      </select>
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button (click)="signup()" [disabled]="loading">
      {{ loading ? "Signing up..." : "Sign Up" }}
    </button>

    <p class="link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
